apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: platform-plugin-suite
  title: Platform Plugin Suite
  description: >
    The internal developer platform built as a Backstage plugin suite — request
    management, per-team RBAC, Argo-backed provisioning, per-request secrets and
    the shadcn design system. Documentation follows Diátaxis.
  annotations:
    # TechDocs source is this repo root: mkdocs.yml + docs/. Register this file
    # as a catalog location once the repo is reachable from Backstage, and the
    # Docs tab serves the same site the `docs` workflow publishes to Pages.
    backstage.io/techdocs-ref: dir:.
  tags:
    - platform
    - documentation
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-admins
