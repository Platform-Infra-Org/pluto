apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: acme-billing
  title: ACME Billing (vendor)
  description: >
    A third-party application we operate but do not own the source of. Its
    documentation is written and versioned here, in the catalog repo, and served
    by TechDocs from this directory — the pattern for any app whose repository
    we cannot add an mkdocs.yml to.
  annotations:
    # TechDocs builds from the mkdocs.yml next to this file, not from the
    # vendor's repository.
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://example.com/acme/billing
      title: Vendor documentation
  tags:
    - vendor
    - documentation
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-admins
