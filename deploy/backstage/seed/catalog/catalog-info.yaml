apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: platform-catalog
  description: Platform resources (users + groups come from LDAP)
spec:
  type: url
  targets:
    # Users and groups are ingested from LDAP (see ldap.providers in app-config),
    # not seeded here.
    - ./example-docs/catalog-info.yaml
    - ./resources/audit-logs.yaml
    - ./resources/payments-exports.yaml
    - ./resources/orders-db.yaml
    - ./resources/payments-primary/catalog-info.yaml
    - ./resources/search-index.yaml
    - ./resources/prod-net.yaml
