apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: orders-db
  annotations:
    platform.io/resource-type: database
    # Resource data ref (like backstage.io/techdocs-ref):
    #   dir:<relative>  → a file next to this one (resources/orders-db-data.json)
    #   url:<absolute>  → any reader-allowed URL
    platform.io/resource-data: dir:./orders-db-data.json
spec:
  type: database
  owner: "group:default/payments"
