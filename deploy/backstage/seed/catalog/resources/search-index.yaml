apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: search-index
  annotations:
    platform.io/resource-type: database
spec:
  type: database
  owner: "group:default/search"
  definition:
    apiVersion: platform/v1
    kind: Database
    metadata:
      name: search-index
      ownerTeam: search
    spec:
      engine: elasticsearch
      version: 8
      size: medium
