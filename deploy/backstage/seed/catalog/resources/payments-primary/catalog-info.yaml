apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: payments-primary
  annotations:
    platform.io/resource-type: database
    # TechDocs source lives next to this file (mkdocs.yml + docs/).
    backstage.io/techdocs-ref: dir:.
    # (No resource-data ref → the Resource Data tab uses the spec.resourceData
    # fallback below. See orders-db for the ref-to-a-file example.)
spec:
  type: database
  owner: "group:default/payments"
  resourceData:
    apiVersion: platform/v1
    kind: Database
    metadata:
      name: payments-primary
      ownerTeam: payments
    spec:
      engine: postgres
      version: 16
      size: large
      region: eu-west-1
