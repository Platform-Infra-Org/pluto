apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: audit-logs
  annotations:
    platform.io/resource-type: bucket
spec:
  type: bucket
  owner: "group:default/payments"
  definition:
    apiVersion: platform/v1
    kind: Bucket
    metadata:
      name: audit-logs
      ownerTeam: payments
    spec:
      region: eu-west-1
      versioning: true
      retentionDays: 365
    payload:
      method: POST
      url: "https://storage.api/buckets"
      body:
        name: audit-logs
        region: eu-west-1
        versioning: true
        policy_arn: "<<mapping.internals.grant_read.outputs.policy_arn>>"
    mapping:
      children:
        database:
          service: database
          action: reference
          inputs:
            id: orders-db
          outputs: {}
          mapping:
            children: {}
            internals: {}
      internals:
        grant_read:
          type: api-call
          request:
            method: POST
            url: "https://iam.api/policies"
          extract:
            policy_arn: $.arn
          outputs:
            policy_arn: null
