apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: git-resource
  title: Git Resource
  description: >
    Provision a resource by committing it to the catalog Git repo via the
    git-ops Argo workflow (create). Edit and delete run the same workflow's
    update/delete entrypoints — the workflow is the only thing that writes Git.
  tags:
    - platform
    - demo
  annotations:
    platform.io/resource-type: git-resource
    # Edit → git-ops update (rewrites the resource's data file with the edited
    # data). Delete → git-ops delete (removes the resource + its data file).
    platform.io/verb-update: '{"argoSubmit":{"namespace":"argo","workflowTemplate":"git-ops","entrypoint":"update","parameters":{"name":"<< resourceName >>","data":"<< paramsJson >>"}},"resultOutput":"resource-ref"}'
    platform.io/verb-delete: '{"argoSubmit":{"namespace":"argo","workflowTemplate":"git-ops","entrypoint":"delete","parameters":{"name":"<< resourceName >>"}}}'
spec:
  owner: group:default/checkout
  type: resource
  parameters:
    - title: Resource details
      required:
        - name
      properties:
        name:
          type: string
          title: Name
        size:
          type: string
          title: Size
          default: small
          enum: [small, medium, large]
        region:
          type: string
          title: Region
          default: us-east-1
  steps:
    - id: submit
      name: Submit request
      action: platform:request:submit
      input:
        resourceType: git-resource
        resourceName: ${{ parameters.name }}
        kind: CREATE
        params:
          size: ${{ parameters.size }}
          region: ${{ parameters.region }}
        resultOutput: resource-ref
        argoSubmit:
          namespace: argo
          workflowTemplate: git-ops
          entrypoint: create
          parameters:
            name: "<< resourceName >>"
            type: "git-resource"
            owner: "group:default/checkout"
            data: "<< paramsJson >>"
          labels:
            platform.io/requested-by: "<< requester >>"
  output:
    links:
      - title: Open request
        url: /requests/${{ steps.submit.output.requestId }}
