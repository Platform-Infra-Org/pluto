apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: demo-resource
  title: Demo Resource
  description: >
    Request a demo resource. Submitting creates an approval request; once
    approved, an Argo workflow provisions it and the request tracks it to done.
  tags:
    - platform
    - demo
  annotations:
    # TechDocs for the template itself (Docs tab on the template page).
    backstage.io/techdocs-ref: dir:.
    # Ties requests with this resourceType back to this template (and its owner,
    # the service team) for per-team approval.
    platform.io/resource-type: demo-resource
    platform.io/verb-update: '{"argoSubmit":{"namespace":"argo","workflowTemplate":"git-ops","entrypoint":"update","parameters":{"name":"<< resourceName >>","data":"<< paramsJson >>"}},"resultOutput":"resource-ref"}'
    platform.io/verb-delete: '{"argoSubmit":{"namespace":"argo","workflowTemplate":"git-ops","entrypoint":"delete","parameters":{"name":"<< resourceName >>"}}}'
spec:
  # The template owner IS the service owner: only this team (or an admin) may
  # approve create/update/delete requests for demo-resource.
  owner: group:default/owners-payments
  type: resource
  parameters:
    - title: Resource details
      required:
        - resourceName
        - region
      properties:
        resourceName:
          type: string
          title: Name
          description: Name of the resource to provision
        region:
          type: string
          title: Region
          description: Options are fetched live from an API (refreshed on an interval).
          ui:field: DynamicSelect
          ui:options:
            # Routed through the Backstage proxy, which injects upstream auth
            # server-side (see proxy.endpoints./demo-options in app-config).
            proxyPath: /demo-options/regions
            intervalMs: 30000
  steps:
    - id: submit
      name: Submit request
      action: platform:request:submit
      input:
        resourceType: demo-resource
        resourceName: ${{ parameters.resourceName }}
        kind: CREATE
        params:
          region: ${{ parameters.region }}
        # create commits the resource to Git via the shared git-ops workflow.
        # << paramsJson >> becomes the resource's data file.
        argoSubmit:
          namespace: argo
          workflowTemplate: git-ops
          entrypoint: create
          parameters:
            name: "<< resourceName >>"
            type: "demo-resource"
            owner: "group:default/owners-payments"
            data: "<< paramsJson >>"
          labels:
            platform.io/requested-by: "<< requester >>"
        resultOutput: resource-ref
  output:
    links:
      - title: Open request
        url: /requests/${{ steps.submit.output.requestId }}
