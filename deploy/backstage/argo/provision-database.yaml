# WorkflowTemplate for the `database` resourceType — create / update / delete
# entrypoints. update & delete receive the resource's current data JSON as the
# `data` parameter (from the template's platform.io/verb-* annotations, which
# reference << resourceData >>). Stubs: echo the inputs and emit resource-ref.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: provision-database
  namespace: argo
spec:
  entrypoint: create
  arguments:
    parameters:
      - { name: name, value: "db" }
      - { name: data, value: "{}" }
      - { name: changes, value: "{}" }
      - { name: request, value: "{}" }
  templates:
    - name: create
      inputs:
        parameters:
          - { name: name, value: "db" }
          - { name: request, value: "{}" }
      outputs:
        parameters:
          - name: resource-ref
            globalName: resource-ref
            valueFrom: { path: /tmp/resource-ref }
      container:
        image: alpine:3.20
        command: [sh, -c]
        args:
          - |
            echo "create database {{inputs.parameters.name}}"
            echo "request={{inputs.parameters.request}}"
            printf '%s' "{{inputs.parameters.name}}" > /tmp/resource-ref
            sleep 3
    - name: update
      inputs:
        parameters:
          - { name: name, value: "db" }
          - { name: data, value: "{}" }
          - { name: changes, value: "{}" }
      outputs:
        parameters:
          - name: resource-ref
            globalName: resource-ref
            valueFrom: { path: /tmp/resource-ref }
      container:
        image: alpine:3.20
        command: [sh, -c]
        args:
          - |
            echo "update database {{inputs.parameters.name}}"
            echo "current data={{inputs.parameters.data}}"
            echo "changes={{inputs.parameters.changes}}"
            printf '%s' "{{inputs.parameters.name}}" > /tmp/resource-ref
            sleep 3
    - name: delete
      inputs:
        parameters:
          - { name: name, value: "db" }
          - { name: data, value: "{}" }
      container:
        image: alpine:3.20
        command: [sh, -c]
        args:
          - |
            echo "delete database {{inputs.parameters.name}}"
            echo "data={{inputs.parameters.data}}"
            sleep 3
