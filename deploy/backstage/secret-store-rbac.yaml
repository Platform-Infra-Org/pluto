# RBAC for the platform-requests backend's SecretStore (docs/SECRETS-LIFECYCLE.md).
# The backend creates one Secret per request (owned by its Argo Workflow), deletes
# it on reject, and sweeps orphans — so it needs create/delete/list on Secrets in
# the Argo namespace, and NOTHING else. It never reads Secret contents (no `get`).
#
# Apply into the namespace the Argo Workflows run in (must match
# platform.secrets.namespace). In-cluster, mount this ServiceAccount on the
# Backstage backend pod. In local dev the backend uses your kubeconfig instead.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-requests-secrets
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-requests-secrets
  namespace: argo
rules:
  # Create + delete per-request Secrets; list for the orphan sweep.
  # Deliberately no `get` — the backend writes secrets, it never reads them back.
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['create', 'delete', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-requests-secrets
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: platform-requests-secrets
    namespace: argo
roleRef:
  kind: Role
  name: platform-requests-secrets
  apiGroup: rbac.authorization.k8s.io
