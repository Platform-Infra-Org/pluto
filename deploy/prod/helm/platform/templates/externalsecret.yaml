{{/*
Optional: let External Secrets Operator fill the Secret this chart references.

The Deployment reads `secrets.existingSecret` either way, so turning this on or
off changes nothing about the pod — only who is responsible for populating it.
Leave it off and create that Secret however your platform team already does.
*/}}
{{- if .Values.secrets.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "platform.fullname" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.secrets.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    # The same name the Deployment mounts, so ESO writes where the pod looks.
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.secrets.externalSecrets.data | nindent 4 }}
{{- end }}
