apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restarts the pods when the rendered config changes. Without this a
        # helm upgrade that only touches app-config silently changes nothing
        # until something else forces a rollout.
        checksum/app-config: {{ include (print $.Template.BasePath "/configmap-app-config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "platform.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backstage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # `command` must be set, not just `args`. The image declares no
          # ENTRYPOINT of its own, so args alone REPLACE the whole CMD —
          # including the `node packages/backend` at the front of it. What is
          # left starts with `--config`, and the node base image's
          # docker-entrypoint.sh prepends `node` to any argv beginning with a
          # dash, producing `node --config …` and the error "node: bad option
          # --config".
          command:
            - "node"
            - "packages/backend"
          # The image's CMD already loads app-config.yaml and the baked-in
          # app-config.production.yaml. Ours is appended last so it wins, and
          # the baked-in file stays the documented default for anyone running
          # the image without this chart.
          args:
            - "--config"
            - "app-config.yaml"
            - "--config"
            - "app-config.production.yaml"
            - "--config"
            - "/etc/platform/app-config.production.yaml"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DATABASE
              value: {{ .Values.postgres.database | quote }}
            # node-postgres reads this; it is how sslmode reaches the driver.
            - name: PGSSLMODE
              value: {{ .Values.postgres.sslMode | quote }}
            {{- include "platform.secretEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            # Generous on purpose: a liveness probe that fires during a slow
            # catalog refresh restarts a healthy pod and makes it slower.
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: app-config
              mountPath: /etc/platform/app-config.production.yaml
              subPath: app-config.production.yaml
              readOnly: true
            {{- if .Values.postgres.caCertSecret }}
            - name: postgres-ca
              mountPath: /etc/platform/postgres-ca
              readOnly: true
            {{- end }}
            # readOnlyRootFilesystem is on, and both the scaffolder and
            # techdocs write to temp while they work.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: app-config
          configMap:
            name: {{ include "platform.fullname" . }}-app-config
        {{- if .Values.postgres.caCertSecret }}
        - name: postgres-ca
          secret:
            secretName: {{ .Values.postgres.caCertSecret }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
