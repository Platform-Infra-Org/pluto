# Values for the platform chart.
#
# Nothing here is a secret. Every credential is read from a Kubernetes Secret
# you already have, or from one External Secrets Operator syncs for you — see
# `secrets` below.

replicaCount: 2

image:
  repository: ghcr.io/OWNER/REPO/backstage
  # Defaults to .Chart.AppVersion. Pin a digest in production if you can.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 7007

ingress:
  enabled: true
  className: nginx
  annotations: {}
  # The public URL of the portal. Also becomes app.baseUrl / backend.baseUrl,
  # which the browser and your IdP's redirect URI must both agree on.
  host: platform.example.com
  tls:
    enabled: true
    # Omit to let cert-manager issue one via the annotations above.
    secretName: platform-tls

# -- Where credentials come from -------------------------------------------
#
# Two supported shapes, and the chart never invents a third:
#
#   existingSecret  — you (or your platform team) already manage a Secret with
#                     the keys below. Nothing is templated; the chart only
#                     references it. This is the default and the safe one.
#
#   externalSecrets — the chart renders an ExternalSecret so the External
#                     Secrets Operator syncs those keys out of Vault, AWS
#                     Secrets Manager, Azure Key Vault or CyberArk into the
#                     Secret named in existingSecret.
#
# In both cases the pod reads the same Secret, so switching between them
# changes nothing about the Deployment.
secrets:
  existingSecret: platform-secrets

  # Key names inside that Secret. Rename to match an existing Secret rather
  # than copying data around.
  keys:
    postgresPassword: POSTGRES_PASSWORD
    oidcClientSecret: OIDC_CLIENT_SECRET
    authSessionSecret: AUTH_SESSION_SECRET
    ldapBindSecret: LDAP_BIND_SECRET
    bitbucketToken: BITBUCKET_TOKEN
    argoToken: ARGO_TOKEN
    # Envelope key for per-request secrets. A list rotates: first encrypts,
    # all are tried on decrypt. See docs/explanation/secrets-lifecycle.md.
    platformSecretKey: PLATFORM_SECRET_KEY

  externalSecrets:
    enabled: false
    secretStoreRef:
      name: vault
      kind: ClusterSecretStore
    refreshInterval: 1h
    # remoteKey/property per entry; `key` is the key written into the Secret.
    data: []
    #  - key: POSTGRES_PASSWORD
    #    remoteRef:
    #      key: platform/prod/postgres
    #      property: password

# -- External Postgres (you supply it) --------------------------------------
postgres:
  host: postgres.example.internal
  port: 5432
  user: backstage
  database: backstage
  # require | verify-ca | verify-full. Anything but disable is strongly advised.
  sslMode: require
  # Optional: a ConfigMap/Secret holding the CA bundle, mounted for verify-*.
  caCertSecret: ""
  caCertKey: ca.crt

# -- SSO (OIDC) --------------------------------------------------------------
oidc:
  metadataUrl: https://sso.example.com/realms/platform/.well-known/openid-configuration
  clientId: backstage
  # The sign-in resolver. The default maps the email local part to the catalog
  # user name; if your directory's uid differs from the email local part, use
  # a resolver keyed on a stable claim instead.
  signInResolver: emailLocalPartMatchingUserEntityName
  # Extra scopes beyond openid/profile/email.
  additionalScopes: []

# -- Directory (Active Directory over LDAPS) ---------------------------------
ldap:
  target: ldaps://ad.example.com:636
  bindDn: CN=svc-backstage,OU=Service Accounts,DC=example,DC=com
  users:
    dn: OU=People,DC=example,DC=com
    filter: (&(objectClass=user)(!(objectClass=computer)))
    map:
      # AD's sAMAccountName is the usual stable handle; it must agree with
      # whatever the OIDC sign-in resolver produces.
      name: sAMAccountName
      displayName: displayName
      email: mail
  groups:
    dn: OU=Groups,DC=example,DC=com
    filter: (objectClass=group)
    map:
      name: cn
      displayName: cn
      type: sAMAccountName
      members: member
  schedule:
    frequency: { hours: 1 }
    timeout: { minutes: 15 }

# -- Bitbucket Data Center ---------------------------------------------------
bitbucket:
  host: bitbucket.example.com
  project: PLATFORM
  # Repos holding the catalog and the software templates.
  catalogRepo: catalog
  templatesRepo: software-templates

# -- Argo Workflows ----------------------------------------------------------
argo:
  # Reached through the Backstage proxy so the token stays server-side.
  serverUrl: https://argo-server.argo.svc.cluster.local:2746
  namespace: argo
  defaultTemplate: demo-resource
  proxyPath: /argo-workflows

# -- Platform behaviour ------------------------------------------------------
platform:
  rbac:
    adminGroups: [group:default/platform-admins]
    auditorGroups: [group:default/platform-auditors]
  secrets:
    enabled: true
    # Must match argo.namespace: the Secret carries an ownerReference to the
    # Workflow, and ownerReferences are namespace-local.
    namespace: argo
    sweep:
      enabled: true
      frequency: { minutes: 15 }
      maxAgeHours: 24
  requests:
    retention:
      enabled: false
      dryRun: false
      frequency: { hours: 6 }
      batchSize: 500
      pendingExpiryDays: 14
      succeededDays: 90
      failedDays: 90
      rejectedDays: 30
      expiredDays: 30
  home:
    title: Welcome to Platform
    subtitle: Your resources and open requests at a glance
    sections:
      - quickActions
      - ownedResources
      - standingRequests
      - pendingApprovals
      - recentlyVisited
      - favouriteTemplates
    maxItems: 8
  branding: {}
  #  mark: /branding/mark.svg
  #  flavour: fantasy

# Anything here is merged over the generated config, last-wins. The escape
# hatch for keys this chart does not model — use it rather than forking.
extraAppConfig: {}

# -- Pod shape ---------------------------------------------------------------
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { memory: 1Gi }

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Applied to the container; the pod-level context is set in the template.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
