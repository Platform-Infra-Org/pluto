apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provision-database
  title: Provision Database
  description: >
    Request a managed database. Shows full control over the Argo submit:
    a custom namespace, service account, entrypoint, generateName, and
    templated parameters/labels/annotations.
  tags:
    - platform
    - database
  annotations:
    # resourceType 'database' → this template → its owner (the service team).
    platform.io/resource-type: database
    # Per-verb Argo submit for edit/delete via the shared git-ops workflow.
    # << paramsJson >> = the edited data (the card sends the full field set).
    platform.io/verb-update: '{"argoSubmit":{"namespace":"argo","workflowTemplate":"git-ops","entrypoint":"update","parameters":{"name":"<< resourceName >>","dataPath":"<< resourceDataPath >>","data":"<< paramsJson >>"}},"resultOutput":"resource-ref"}'
    platform.io/verb-delete: '{"argoSubmit":{"namespace":"argo","workflowTemplate":"git-ops","entrypoint":"delete","parameters":{"name":"<< resourceName >>","path":"<< resourcePath >>","dataPath":"<< resourceDataPath >>"}}}'
spec:
  # A different service team than demo-resource: its members (or an admin) may
  # approve database requests; the demo-resource owner cannot.
  owner: group:default/payments
  type: database
  parameters:
    - title: Database details
      required:
        - resourceName
        - engine
        - size
      properties:
        resourceName:
          type: string
          title: Name
          description: Name of the database to provision
        engine:
          type: string
          title: Engine
          default: postgres
          enum: [postgres, mysql, mariadb]
        size:
          type: string
          title: Size
          description: Options are fetched live from an API (refreshed on an interval).
          ui:field: DynamicSelect
          ui:options:
            proxyPath: /demo-options/sizes
            intervalMs: 30000
        space:
          type: string
          title: Space
          ui:field: DynamicSelect
          ui:options: { proxyPath: /infra/coordinate-tree, treePath: coordinates }
        network:
          type: string
          title: Network
          ui:field: DynamicSelect
          ui:options: { proxyPath: /infra/coordinate-tree, treePath: coordinates, dependsOn: [space] }
        region:
          type: string
          title: Region
          ui:field: DynamicSelect
          ui:options: { proxyPath: /infra/coordinate-tree, treePath: coordinates, dependsOn: [space, network] }
        island:
          type: string
          title: Island
          ui:field: DynamicSelect
          ui:options: { proxyPath: /infra/coordinate-tree, treePath: coordinates, dependsOn: [space, network, region] }
        environment:
          type: string
          title: Environment
          ui:field: DynamicSelect
          ui:options: { proxyPath: /infra/coordinate-tree, treePath: coordinates, dependsOn: [space, network, region, island] }
  steps:
    - id: submit
      name: Submit request
      action: platform:request:submit
      input:
        resourceType: database
        resourceName: ${{ parameters.resourceName }}
        kind: CREATE
        params:
          engine: ${{ parameters.engine }}
          size: ${{ parameters.size }}
          space: ${{ parameters.space }}
          network: ${{ parameters.network }}
          region: ${{ parameters.region }}
          island: ${{ parameters.island }}
          environment: ${{ parameters.environment }}
        # create commits the resource to Git via the shared git-ops workflow.
        argoSubmit:
          namespace: argo
          workflowTemplate: git-ops
          entrypoint: create
          parameters:
            name: "<< resourceName >>"
            type: "database"
            owner: "group:default/payments"
            data: "<< paramsJson >>"
          labels:
            platform.io/requested-by: "<< requester >>"
        resultOutput: resource-ref
  output:
    links:
      - title: Open request
        url: /requests/${{ steps.submit.output.requestId }}
