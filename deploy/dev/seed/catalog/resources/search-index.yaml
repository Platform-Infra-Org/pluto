apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: search-index
  # A title that differs from the name on purpose: the UI shows the title,
  # while every link and ref still addresses the name.
  title: Search Index
  annotations:
    platform.io/resource-type: database
spec:
  type: database
  owner: "group:default/search"
  resourceData:
    apiVersion: platform/v1
    kind: Database
    metadata:
      name: search-index
      ownerTeam: search
    spec:
      engine: elasticsearch
      version: 8
      size: medium
