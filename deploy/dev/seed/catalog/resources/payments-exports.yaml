apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: payments-exports
  # A title that differs from the name on purpose: the UI shows the title,
  # while every link and ref still addresses the name.
  title: Payments Export Bucket
  annotations:
    platform.io/resource-type: bucket
spec:
  type: bucket
  owner: "group:default/payments"
  resourceData:
    apiVersion: platform/v1
    kind: Bucket
    metadata:
      name: payments-exports
      ownerTeam: payments
    spec:
      region: eu-west-1
      versioning: true
