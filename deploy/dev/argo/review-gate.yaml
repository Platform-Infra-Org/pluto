# A provisioning workflow with a mid-run approval gate.
#
# The first approval decides whether the workflow starts. This one decides
# whether it continues, with the workflow's own computed values in front of the
# approver — here a plan summary and a cost estimate produced by the `plan`
# step.
#
# The `approve` step is an Argo `suspend` template. Three things about it drive
# how the platform handles it:
#
#   * While waiting it reports `type: Suspend` with `phase: Running` — Argo has
#     no "Suspended" phase, so the platform detects the pair, never the phase.
#   * Its `inputs.parameters` are what the approver reads — review values the
#     workflow computed. Secrets do not travel this way: they reach a workflow
#     through a Kubernetes Secret and `secretKeyRef`, never a parameter.
#   * `outputs.parameters[].valueFrom.supplied: {}` is a question it asks. The
#     approver's answer is set with the Argo `/set` API immediately before the
#     node is resumed, and reaches the next step as a normal step output.
#   * Each question describes its own field: `description` becomes help text,
#     `enum` makes it a dropdown, and a `default` makes it optional. A parameter
#     with no default must be answered before the platform will resume.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: review-gate
  namespace: argo
spec:
  entrypoint: main
  ttlStrategy:
    secondsAfterCompletion: 600
    secondsAfterSuccess: 600
    secondsAfterFailure: 3600
  # Each request param arrives as its own Argo parameter — the backend forwards
  # them by name (argoSubmit.forwardParams, default true), so this template
  # declares the request fields it reads rather than parsing a JSON blob.
  arguments:
    parameters:
      - { name: region, value: "eu-west-1" }
  templates:
    - name: main
      inputs:
        parameters:
          - { name: region }
      steps:
        - - name: plan
            template: plan
            arguments:
              parameters:
                - { name: region, value: "{{inputs.parameters.region}}" }
        - - name: approve
            template: approve
            arguments:
              parameters:
                - name: plan
                  value: "{{steps.plan.outputs.parameters.summary}}"
                - name: cost
                  value: "{{steps.plan.outputs.parameters.cost}}"
        - - name: apply
            template: apply
            arguments:
              parameters:
                # The approver's answer, supplied at resume time.
                - name: decision
                  value: "{{steps.approve.outputs.parameters.decision}}"
                - name: ticket
                  value: "{{steps.approve.outputs.parameters.ticket}}"

    # Produces the values the human is asked to review.
    - name: plan
      inputs:
        parameters:
          - { name: region }
      container:
        image: alpine:3.20
        command: [sh, -c]
        args:
          - |
            set -eu
            echo "planning for region: {{inputs.parameters.region}}"
            printf '3 to add, 1 to change, 0 to destroy' > /tmp/summary
            printf '$41.20/month' > /tmp/cost
      outputs:
        parameters:
          - name: summary
            valueFrom: { path: /tmp/summary }
          - name: cost
            valueFrom: { path: /tmp/cost }

    # The gate. Waits indefinitely until the platform (or the Argo UI) resumes it.
    - name: approve
      inputs:
        parameters:
          - { name: plan }
          - { name: cost }
      suspend: {}
      outputs:
        parameters:
          # No default => the platform will not resume without an answer.
          # enum => rendered as a dropdown, and enforced server-side too.
          - name: decision
            description: Apply the plan, or apply nothing and finish clean.
            enum:
              - apply
              - skip
            valueFrom:
              supplied: {}
          # A default => optional. Left blank, the default is what gets supplied.
          - name: ticket
            description: Change ticket to record against this decision.
            default: none
            valueFrom:
              supplied: {}

    # Proves the supplied value actually arrived: if resume did not deliver the
    # answer, this step fails rather than quietly succeeding.
    - name: apply
      inputs:
        parameters:
          - { name: decision }
          - { name: ticket }
      container:
        image: alpine:3.20
        command: [sh, -c]
        args:
          - |
            set -eu
            DECISION='{{inputs.parameters.decision}}'
            TICKET='{{inputs.parameters.ticket}}'
            echo "approver decision: ${DECISION} (ticket: ${TICKET})"
            if [ -z "${DECISION}" ]; then
              echo "ERROR: resumed without the approver's answer" >&2
              exit 1
            fi
            printf 'review-gate/%s/%s' "${DECISION}" "${TICKET}" > /tmp/result
      outputs:
        parameters:
          - name: result
            valueFrom: { path: /tmp/result }
            globalName: result
