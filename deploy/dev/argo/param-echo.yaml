# A workflow that only reports what it was given — the counterpart to
# `forwardParams`.
#
# Every request param now arrives as its own named Argo parameter, so a template
# no longer needs an `argoSubmit.parameters` block restating the form. This
# template exists to make that visible: it declares the parameters it expects
# and prints each one, so a run's logs are the evidence of what was forwarded,
# what was coerced, and what won a collision.
#
# It writes nothing and touches no Git repo, so it is safe to run repeatedly.
#
# Note what a template must now do: DECLARE the parameters it receives. Argo
# accepts undeclared parameters silently (verified against argo-server — they
# land in spec.arguments.parameters and are simply never referenced), so a
# missing declaration is not an error, it is a value you cannot read.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: param-echo
  namespace: argo
spec:
  entrypoint: echo-params
  arguments:
    parameters:
      # Defaults matter here: they are what you see when a field was NOT
      # forwarded, which is how an absent value is told apart from a blank one.
      # A request param that is null or undefined is skipped entirely rather
      # than sent as '', precisely so these defaults survive.
      - { name: region, value: "(default — not forwarded)" }
      - { name: size, value: "(default — not forwarded)" }
      - { name: replicas, value: "(default — not forwarded)" }
      - { name: tags, value: "(default — not forwarded)" }
      - { name: note, value: "(default — not forwarded)" }
  templates:
    - name: echo-params
      inputs:
        parameters:
          - { name: region }
          - { name: size }
          - { name: replicas }
          - { name: tags }
          - { name: note }
      outputs:
        parameters:
          # Echoed back as the request's result so the outcome is visible on the
          # request page without opening the Argo UI.
          - name: resource-ref
            valueFrom: { path: /tmp/summary }
      container:
        image: alpine:3.20
        command: [sh, -c]
        args:
          - |
            set -eu
            echo "=== parameters this workflow received ==="
            echo "region   = {{inputs.parameters.region}}"
            echo "size     = {{inputs.parameters.size}}"
            echo "replicas = {{inputs.parameters.replicas}}   <- number coerced to string"
            echo "tags     = {{inputs.parameters.tags}}       <- array/object as JSON"
            echo "note     = {{inputs.parameters.note}}       <- set in argoSubmit.parameters, so it wins"
            printf 'region=%s size=%s replicas=%s' \
              "{{inputs.parameters.region}}" \
              "{{inputs.parameters.size}}" \
              "{{inputs.parameters.replicas}}" > /tmp/summary
