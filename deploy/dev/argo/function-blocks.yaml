# P0 stub function-block WorkflowTemplates. The graph generator (P3) emits
# WorkflowTemplates that `templateRef` these by name; here they just echo their
# inputs so referenced blocks resolve and runs succeed. Real block behavior is P5/CB05.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fn-jinja-render
  namespace: argo
spec:
  templates:
    - name: run
      inputs:
        parameters:
          - { name: template, value: "" }
          # No `request` blob: the backend forwards each request param as its
          # own named Argo parameter, so a block declares what it reads.
          - { name: resolved, value: "{}" }
      container:
        image: alpine:3.20
        command: [sh, -c]
        args: ["echo 'fn-jinja-render' && echo \"resolved={{inputs.parameters.resolved}}\""]
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fn-api-call
  namespace: argo
spec:
  templates:
    - name: run
      inputs:
        parameters:
          - { name: payload, value: "{}" }
      container:
        image: alpine:3.20
        command: [sh, -c]
        args: ["echo 'fn-api-call' && echo \"payload={{inputs.parameters.payload}}\""]
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fn-json-extractor
  namespace: argo
spec:
  templates:
    - name: run
      inputs:
        parameters:
          - { name: source, value: "{}" }
          - { name: rules, value: "{}" }
      container:
        image: alpine:3.20
        command: [sh, -c]
        args: ["echo 'fn-json-extractor' && echo \"rules={{inputs.parameters.rules}}\""]
