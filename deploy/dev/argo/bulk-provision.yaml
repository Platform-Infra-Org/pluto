# One request, several created resources — and a `resource-ref` that is a JSON
# ARRAY rather than a single name.
#
# This exists to exercise the multi-resource result path end to end: the backend
# stores whatever the `resultOutput` parameter contains, verbatim, and the
# request page parses it (`parseResultRefs`). A single name still renders one
# link; an array renders one link per resource. Nothing about the request
# lifecycle changes — one request, one approval, one workflow.
#
# Why a fan-out rather than git-ops's `bulk-delete`: delete already had a list to
# work from (`<< resourcesJson >>`, resolved from resources that exist). Create
# has no such list, because the resources do not exist yet — the names are
# derived here, from a base name and a count.
#
# `parallelism: 1` is correctness, not throttling, exactly as in git-ops: every
# iteration clones, commits and pushes the same branch of the same repo, and
# concurrent pushes lose a race and fail.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bulk-provision
  namespace: argo
spec:
  entrypoint: main
  arguments:
    parameters:
      - { name: name, value: "demo" }
      - { name: count, value: "3" }
      - { name: type, value: "git-resource" }
      - { name: owner, value: "group:default/checkout" }
      - { name: size, value: "small" }
      - { name: repoUrl, value: "http://host.docker.internal:3001/platform/catalog.git" }
      - { name: creds, value: "platform:platform" }
  templates:
    - name: main
      # Correctness, not throttling: every iteration clones, commits and pushes
      # the same branch of the same repo. Without this, one iteration wins and
      # the rest fail their push — observed here as 1 of 3 succeeding.
      parallelism: 1
      inputs:
        parameters:
          - { name: name }
          - { name: count }
          - { name: type }
          - { name: owner }
          - { name: size }
          - { name: repoUrl }
          - { name: creds }
      outputs:
        parameters:
          # What the backend reads when the template sets
          # `resultOutput: resource-ref`. A JSON array of the created names.
          - name: resource-ref
            valueFrom:
              parameter: "{{steps.names.outputs.parameters.refs}}"
      steps:
        # 1. Derive the names once, up front, and emit them as a JSON array.
        #    Deriving them here rather than inside the loop means the array the
        #    request links to is the same list the loop acted on — they cannot
        #    drift if an iteration is retried.
        #    A step does not inherit its template's inputs — they are passed
        #    explicitly or Argo rejects the spec before anything runs.
        - - name: names
            template: derive-names
            arguments:
              parameters:
                - { name: name, value: "{{inputs.parameters.name}}" }
                - { name: count, value: "{{inputs.parameters.count}}" }
        # 2. Create one resource per name.
        - - name: provision
            template: create-one
            withParam: "{{steps.names.outputs.parameters.refs}}"
            arguments:
              parameters:
                - { name: name, value: "{{item}}" }
                - { name: type, value: "{{inputs.parameters.type}}" }
                - { name: owner, value: "{{inputs.parameters.owner}}" }
                - { name: size, value: "{{inputs.parameters.size}}" }
                - { name: repoUrl, value: "{{inputs.parameters.repoUrl}}" }
                - { name: creds, value: "{{inputs.parameters.creds}}" }

    # <base>-1 … <base>-N as a JSON array, e.g. ["demo-1","demo-2","demo-3"].
    #
    # Built with printf rather than jq: the obvious jq images are scratch-based
    # and have no shell, so `command: [sh, -c]` fails with a bare "sh not found"
    # that looks nothing like the real cause. Reusing alpine/git — already
    # pulled for create-one — costs no extra image.
    #
    # String-joining JSON is normally a bad idea, but a Backstage entity name is
    # restricted to lowercase alphanumerics, `-`, `_` and `.`, so no value here
    # can contain a quote or backslash needing escape. `count` is bounded by the
    # form (1..5) and used only as a loop bound.
    - name: derive-names
      inputs:
        parameters:
          - { name: name }
          - { name: count }
      outputs:
        parameters:
          - name: refs
            valueFrom: { path: /tmp/refs.json }
      container:
        image: alpine/git:2.45.2
        command: [sh, -c]
        args:
          - |
            set -eu
            BASE="{{inputs.parameters.name}}"; N="{{inputs.parameters.count}}"
            i=1; SEP=""
            printf '[' > /tmp/refs.json
            while [ "$i" -le "$N" ]; do
              printf '%s"%s-%s"' "$SEP" "$BASE" "$i" >> /tmp/refs.json
              SEP=","; i=$((i + 1))
            done
            printf ']' >> /tmp/refs.json
            cat /tmp/refs.json

    # Same catalog layout git-ops writes: resources/<name>.yaml plus a sibling
    # <name>-data.json, registered with the root Location. Kept in step with
    # git-ops deliberately — a resource created here must be updatable and
    # deletable by the normal verbs afterwards.
    - name: create-one
      inputs:
        parameters:
          - { name: name }
          - { name: type }
          - { name: owner }
          - { name: size }
          - { name: repoUrl }
          - { name: creds }
      container:
        image: alpine/git:2.45.2
        env:
          - { name: REPO_URL, value: "{{inputs.parameters.repoUrl}}" }
          - { name: GIT_CREDS, value: "{{inputs.parameters.creds}}" }
        command: [sh, -c]
        args:
          - |
            set -eu
            NAME="{{inputs.parameters.name}}"; TYPE="{{inputs.parameters.type}}"
            OWNER="{{inputs.parameters.owner}}"; SIZE="{{inputs.parameters.size}}"
            git clone --depth 1 --quiet \
              "$(printf '%s' "$REPO_URL" | sed -e "s#://#://$GIT_CREDS@#")" /work
            cd /work
            git config user.email platform@backstage.local
            git config user.name 'Platform (bulk-provision)'
            mkdir -p resources
            # A title that differs from the name on purpose: this is also the
            # fixture for the resource-title work, where the page must show the
            # title and still link by name.
            cat > "resources/$NAME.yaml" <<YAML
            apiVersion: backstage.io/v1alpha1
            kind: Resource
            metadata:
              name: $NAME
              title: "Bulk $NAME (titled)"
              annotations:
                platform.io/resource-type: $TYPE
                platform.io/resource-data: dir:./$NAME-data.json
            spec:
              type: $TYPE
              owner: $OWNER
            YAML
            printf '{"size":"%s","createdBy":"bulk-provision"}' "$SIZE" \
              > "resources/$NAME-data.json"
            if ! grep -qF "./resources/$NAME.yaml" catalog-info.yaml; then
              awk -v line="    - ./resources/$NAME.yaml" \
                '{print} /^[[:space:]]*targets:[[:space:]]*$/ && !d {print line; d=1}' \
                catalog-info.yaml > /tmp/ci.yaml && mv /tmp/ci.yaml catalog-info.yaml
            fi
            git add -A
            git diff --cached --quiet || {
              git commit --quiet -m "create $NAME (bulk)"; git push --quiet origin HEAD:main; }
            echo "created $NAME"
