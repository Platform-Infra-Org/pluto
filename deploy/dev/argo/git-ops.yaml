# The one WorkflowTemplate that mutates the catalog Git repo for every resource
# type: create / update / delete. Each resource is a `resources/<name>.yaml`
# Resource entity whose data lives in a sibling `resources/<name>-data.json`,
# referenced by `platform.io/resource-data: ./<name>-data.json` (a ref, like
# techdocs-ref). update rewrites that data file; delete removes both files.
#
# Plain git over HTTPS, not a hosting provider's contents API — the same steps
# work against Gitea in dev and Bitbucket (or anything else) in production, and
# the only per-host input is `repoUrl`. Dev reaches Gitea on the host through
# host.docker.internal (Docker Desktop).
#
# Each verb clones, edits files, and commits; an unchanged tree is not an error,
# so re-running a workflow is idempotent. Credentials arrive as an env var and
# are spliced into the remote URL at push time, so they stay out of the workflow
# spec, the UI, and the log.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: git-ops
  namespace: argo
spec:
  entrypoint: create
  arguments:
    parameters:
      - { name: name, value: "resource" }
      - { name: type, value: "resource" }
      - { name: owner, value: "group:default/platform" }
      - { name: data, value: "{}" }
      - { name: repoUrl, value: "http://host.docker.internal:3001/platform/catalog.git" }
      - { name: creds, value: "platform:platform" }
  templates:
    - name: create
      inputs:
        parameters:
          - { name: name }
          - { name: type }
          - { name: owner }
          - { name: data }
          - { name: repoUrl }
          - { name: creds }
      outputs:
        parameters:
          - name: resource-ref
            globalName: resource-ref
            valueFrom: { path: /tmp/resource-ref }
      container:
        image: alpine/git:2.45.2
        env:
          - { name: REPO_URL, value: "{{inputs.parameters.repoUrl}}" }
          - { name: GIT_CREDS, value: "{{inputs.parameters.creds}}" }
        command: [sh, -c]
        args:
          - |
            set -eu
            NAME="{{inputs.parameters.name}}"; TYPE="{{inputs.parameters.type}}"
            OWNER="{{inputs.parameters.owner}}"; DATA='{{inputs.parameters.data}}'
            git clone --depth 1 --quiet \
              "$(printf '%s' "$REPO_URL" | sed -e "s#://#://$GIT_CREDS@#")" /work
            cd /work
            git config user.email platform@backstage.local
            git config user.name 'Platform (git-ops)'
            mkdir -p resources
            cat > "resources/$NAME.yaml" <<YAML
            apiVersion: backstage.io/v1alpha1
            kind: Resource
            metadata:
              name: $NAME
              annotations:
                platform.io/resource-type: $TYPE
                platform.io/resource-data: dir:./$NAME-data.json
            spec:
              type: $TYPE
              owner: $OWNER
            YAML
            printf '%s' "$DATA" > "resources/$NAME-data.json"
            # Register with the root Location if it isn't already listed.
            if ! grep -qF "./resources/$NAME.yaml" catalog-info.yaml; then
              awk -v line="    - ./resources/$NAME.yaml" \
                '{print} /^[[:space:]]*targets:[[:space:]]*$/ && !d {print line; d=1}' \
                catalog-info.yaml > /tmp/ci.yaml && mv /tmp/ci.yaml catalog-info.yaml
            fi
            git add -A
            git diff --cached --quiet || {
              git commit --quiet -m "create $NAME"; git push --quiet origin HEAD:main; }
            printf '%s' "$NAME" > /tmp/resource-ref
            echo "created $NAME"

    - name: update
      inputs:
        parameters:
          - { name: name }
          # Repo path of the data file, resolved by the backend from the
          # resource's own resource-data ref. Falls back to the flat layout.
          - { name: dataPath, value: "" }
          - { name: data }
          - { name: repoUrl }
          - { name: creds }
      outputs:
        parameters:
          - name: resource-ref
            globalName: resource-ref
            valueFrom: { path: /tmp/resource-ref }
      container:
        image: alpine/git:2.45.2
        env:
          - { name: REPO_URL, value: "{{inputs.parameters.repoUrl}}" }
          - { name: GIT_CREDS, value: "{{inputs.parameters.creds}}" }
        command: [sh, -c]
        args:
          - |
            set -eu
            NAME="{{inputs.parameters.name}}"; DATA='{{inputs.parameters.data}}'
            P="{{inputs.parameters.dataPath}}"; [ -n "$P" ] || P="resources/$NAME-data.json"
            git clone --depth 1 --quiet \
              "$(printf '%s' "$REPO_URL" | sed -e "s#://#://$GIT_CREDS@#")" /work
            cd /work
            git config user.email platform@backstage.local
            git config user.name 'Platform (git-ops)'
            printf '%s' "$DATA" > "$P"
            git add -A
            git diff --cached --quiet || {
              git commit --quiet -m "update $NAME"; git push --quiet origin HEAD:main; }
            printf '%s' "$NAME" > /tmp/resource-ref
            echo "updated $NAME ($P)"

    - name: delete
      inputs:
        parameters:
          - { name: name }
          # Repo paths of the resource file + its data file, resolved by the
          # backend from the resource's location + resource-data ref. Fall back
          # to the flat layout.
          - { name: path, value: "" }
          - { name: dataPath, value: "" }
          # The resource's data at approval time. `git rm` does not need it —
          # a real deletion workflow does, to decommission the thing itself
          # before its record disappears.
          - { name: data, value: "{}" }
          - { name: repoUrl }
          - { name: creds }
      container:
        image: alpine/git:2.45.2
        env:
          - { name: REPO_URL, value: "{{inputs.parameters.repoUrl}}" }
          - { name: GIT_CREDS, value: "{{inputs.parameters.creds}}" }
          - { name: RESOURCE_DATA, value: "{{inputs.parameters.data}}" }
        command: [sh, -c]
        args:
          - |
            set -eu
            NAME="{{inputs.parameters.name}}"
            printf 'resource data: %s\n' "$RESOURCE_DATA"
            YAML="{{inputs.parameters.path}}"; [ -n "$YAML" ] || YAML="resources/$NAME.yaml"
            DATA="{{inputs.parameters.dataPath}}"; [ -n "$DATA" ] || DATA="resources/$NAME-data.json"
            git clone --depth 1 --quiet \
              "$(printf '%s' "$REPO_URL" | sed -e "s#://#://$GIT_CREDS@#")" /work
            cd /work
            git config user.email platform@backstage.local
            git config user.name 'Platform (git-ops)'
            rm -f "$YAML" "$DATA"
            grep -vF "./$YAML" catalog-info.yaml > /tmp/ci.yaml && mv /tmp/ci.yaml catalog-info.yaml
            git add -A
            git diff --cached --quiet || {
              git commit --quiet -m "delete $NAME"; git push --quiet origin HEAD:main; }
            echo "deleted $NAME ($YAML)"
