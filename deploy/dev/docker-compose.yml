# Self-contained Backstage stack. Distinct ports so it coexists with the legacy
# stack (docker-compose.yml). All credentials are throwaway dev-only values.
#   docker compose -p backstage -f deploy/dev/docker-compose.yml up -d
name: backstage

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage
      POSTGRES_DB: backstage
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro

  openldap:
    image: osixia/openldap:1.5.0
    # --copy-service applies the custom bootstrap LDIF (people + groups) on init.
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: "Platform"
      LDAP_DOMAIN: "platform.local"
      LDAP_ADMIN_PASSWORD: "admin"
    ports:
      - "1389:389"
    volumes:
      - ../ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro

  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3001/
      GITEA__server__HTTP_PORT: "3001"
      GITEA__server__SSH_PORT: "2222"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "3001:3001"
      - "2222:22"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/api/v1/version || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
