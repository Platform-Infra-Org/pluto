apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: platform-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: platform-web:dev
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: platform-dev
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
