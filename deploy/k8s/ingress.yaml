# BFF mounts business endpoints under /api/* and a bare /healthz (for infra
# probes and curl checks). This ingress mirrors that split at the edge:
# /api/* and /healthz -> bff (with /api stripped before it reaches the app),
# everything else -> the web static bundle.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  namespace: platform-dev
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: platform.dev.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: bff
                port:
                  number: 8000
          - path: /()(healthz)
            pathType: ImplementationSpecific
            backend:
              service:
                name: bff
                port:
                  number: 8000
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: web
                port:
                  number: 80
