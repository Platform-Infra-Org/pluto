apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform-dev
data:
  LOG_LEVEL: "INFO"
  CORS_ALLOWED_ORIGINS: "http://platform.dev.local"
  APP_BASE_URL: "http://platform.dev.local"
  BFF_BASE_URL: "http://platform.dev.local/api"
---
# Dev-only placeholder secret. Real deployments must supply DATABASE_URL and
# POSTGRES_PASSWORD via a proper secrets manager / sealed-secret, never Git.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: platform-dev
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/bff"
  POSTGRES_PASSWORD: "postgres"
