{{/*
The backend mints one Kubernetes Secret per approved request, in the workflow
namespace, owned by the Workflow that consumes it.

The verbs below are the ones `secretStore.ts` actually calls — create, delete
and list — and nothing more. `get` is deliberately absent: the backend writes a
secret and forgets it, and the workflow reads it through the kubelet via
`secretKeyRef`, not through this account. An account that cannot read secrets
back cannot leak them if the pod is compromised.

`list` is needed by the orphan sweep, which compares live secrets against
in-flight request ids. It returns metadata for the sweep's purposes, but note
that in Kubernetes list *does* return values — this is the one permission here
worth a second look during a security review, and it is why the sweep is
optional (platform.secrets.sweep.enabled).
*/}}
{{- if .Values.platform.secrets.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "platform.fullname" . }}-secrets
  # The workflow namespace, which may not be the release namespace: the Secret
  # carries an ownerReference to the Workflow and those are namespace-local.
  namespace: {{ .Values.platform.secrets.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "list"]
  # Read-only on the Workflow, to build the ownerReference that makes Argo's
  # own garbage collection delete the Secret with the workflow.
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "platform.fullname" . }}-secrets
  namespace: {{ .Values.platform.secrets.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "platform.fullname" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
