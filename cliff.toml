# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/docs/#introduction
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/docs/#introduction
# ponytail: no compare links — this repo has no remote yet. Restore the
# preset's GitHub footer once one exists.
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = false
# NOTE: git-cliff's skip_merge_commits key is ignored by the version pinned in
# CI, so merge commits are skipped by a parser below instead.
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
    # A merge commit's subject repeats what the commits under it already say.
    # Left in, every feature is listed twice — once as itself and once inside
    # the merge that brought it.
    #
    # Matched on the *type*, never on the word "merge" appearing in a subject.
    # An earlier rule here was `^<type>: merge ` — meant for merges that had
    # been given a conventional prefix — and it silently ate
    # `feat(resources): merge resource edits over the full document`, the
    # headline fix of v0.2.0, which is missing from that release's changelog as
    # a result. A subject is prose; "merge" is an ordinary verb in it.
    #
    # git-cliff's own skip_merge_commits key is ignored by the pinned version
    # (2.13.1), which is why this is done with parsers at all. The cost of the
    # narrower rule is that a merge must not be committed as `feat:`/`fix:` —
    # use `merge:`, or let GitHub write its default subject.
    { message = "(?i)^merge(\\(.+\\))?!?:", skip = true },
    { message = "^Merge ", skip = true },
    # Documentation is not a product change. The changelog answers "what is
    # different if I upgrade", and a docs commit changes nothing for anyone
    # running the software — it landed in "Changed" only because it matched
    # the catch-all at the bottom of this list.
    { message = "^docs(\\(.+\\))?!?:", skip = true },
    # Housekeeping about the changelog itself is not a change to the product.
    # Left in, a release reads as thirty "regenerate the changelog" lines.
    { message = "^chore\\(changelog\\)", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore: bump", skip = true },
    { message = "^[a|A]dd", group = "Added" },
    { message = "^[s|S]upport", group = "Added" },
    { message = "^[r|R]emove", group = "Removed" },
    # "drop" is how half this repo says "remove"; without these, a feat that
    # deletes something is filed under Added.
    { message = "^[d|D]rop", group = "Removed" },
    { message = "^.*: drop", group = "Removed" },
    { message = "^.*: add", group = "Added" },
    { message = "^.*: support", group = "Added" },
    { message = "^.*: remove", group = "Removed" },
    { message = "^.*: delete", group = "Removed" },
    { message = "^feat", group = "Added" },
    { message = "^test", group = "Fixed" },
    { message = "^fix", group = "Fixed" },
    { message = "^.*: fix", group = "Fixed" },
    { message = "^.*", group = "Changed" },
]
# Prevent commits that are breaking from being excluded by commit parsers.
filter_commits = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
