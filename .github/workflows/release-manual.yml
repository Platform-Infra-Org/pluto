# Manual release for branches that never went through the PR flow.
#
# Run it from the Actions tab against any branch. git-cliff is scoped to *that
# branch's* history only, the version is computed (or overridden), the image is
# built, pushed and attested, and a GitHub Release is created from the branch
# HEAD.
#
# Note: releasing off a non-default branch is atypical — the tag/release points
# at the dispatched branch's HEAD, not main. Such builds are marked prerelease
# and the image is *not* tagged `latest`.
name: release-manual

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. v1.2.3). Leave blank to let git-cliff compute it."
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GIT_CLIFF_VERSION: "2.13.1"
  IMAGE: ghcr.io/${{ github.repository }}/backstage

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # the dispatched branch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install git-cliff
        run: |
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

      - name: Compute version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            # --current scopes git-cliff to the checked-out branch's history only.
            version="$(git-cliff --config cliff.toml --current --bumped-version)"
          fi
          # Keep tags uniform: git-cliff drops the v prefix when there are no tags yet.
          echo "version=v${version#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes (this branch only)
        run: git-cliff --config cliff.toml --current --strip all -o RELEASE_NOTES.md

      - name: Tag the branch HEAD
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Build the bundle
        working-directory: backstage
        run: |
          yarn install --immutable
          yarn tsc
          yarn build:all

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest` tag: this is a branch build, not the release line.
      - name: Build and push the image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: backstage
          file: backstage/packages/backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate an SBOM from the image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Append the image reference to the notes
        run: |
          {
            echo
            echo "### Image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${{ steps.ver.outputs.version }}"
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          # Branch builds are flagged as pre-releases.
          prerelease: true
          files: |
            backstage/packages/backend/dist/bundle.tar.gz
            sbom.cdx.json
