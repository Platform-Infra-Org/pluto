# Lint / type-check / test / build on every push and PR. Releasing lives in the
# release-* workflows.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: backstage

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Yarn 4 ships via corepack; the version is pinned in package.json.
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Type check
        run: yarn tsc

      - name: Lint
        run: yarn lint:all

      - name: Tests
        run: yarn test
        env:
          CI: "true"

      # Compiles every workspace package, the frontend bundle, and the backend
      # bundle the image is built from — so a broken build fails here, not in
      # the release.
      - name: Build
        run: yarn build:all

  # Conventional-commit gate: with squash-merge the PR *title* is the commit
  # git-cliff parses, so it must be a valid conventional-commit subject.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
