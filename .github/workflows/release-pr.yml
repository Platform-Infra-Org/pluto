# PR-driven release automation.
#
#   * PR opened / updated against main -> build the backend bundle and the image
#     (no push, no tag, no release); the bundle is uploaded as a workflow
#     artifact so reviewers can inspect what would ship.
#   * PR merged into main              -> git-cliff bumps the version + rewrites
#     CHANGELOG.md, the change is committed back to main, a tag is pushed, the
#     image is built and pushed to GHCR, build provenance is attested, an SBOM is
#     generated from the image, and a GitHub Release is created.
#
# The deliverable here is a container image, not a package: every workspace in
# this repo is private, and the thing you deploy is backstage:<version>.
name: release-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# One run per PR; new pushes cancel the in-flight test build. (closed/merge runs
# to completion.)
concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # git-cliff is a Rust binary — installed from its release tarball rather than
  # through a package manager, since this repo has no Python toolchain.
  GIT_CLIFF_VERSION: "2.13.1"
  # IMAGE is computed per job — see "Resolve the image name".

jobs:
  # ------------------------------------------------------------------ open / update
  # Prove the artifacts build, and hand reviewers the bundle that would ship.
  test-build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # GHCR rejects an uppercase repository name, and github.repository keeps
      # the owner's capitals (Platform-Infra-Org). GitHub expressions have no
      # lower(), so it is lowercased here and read as env.IMAGE from now on.
      - name: Resolve the image name
        run: |
          # tr, not ${VAR,,}: the latter is bash 4+ and cannot be checked
          # on a machine shipping bash 3.2, so it would only ever be
          # verified by the runner.
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${repo}/backstage" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so git-cliff sees them

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install git-cliff
        run: |
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

      - name: Compute the next (bumped) version
        id: ver
        run: |
          # Dev marker keeps the test build from colliding with a real release.
          base="$(git-cliff --config cliff.toml --bumped-version | sed 's/^v//')"
          echo "version=${base}-pr.${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Build the bundle
        working-directory: backstage
        run: |
          yarn install --immutable
          yarn tsc
          yarn build:all

      # Build only — nothing is pushed from a PR.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: backstage
          file: backstage/packages/backend/Dockerfile
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}

      - name: Upload the backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ steps.ver.outputs.version }}
          path: backstage/packages/backend/dist/bundle.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------ merge
  release:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit CHANGELOG, push tag, create the release
      packages: write # push the image to GHCR
      id-token: write # OIDC for keyless provenance signing
      attestations: write # actions/attest-build-provenance
    steps:
      # GHCR rejects an uppercase repository name, and github.repository keeps
      # the owner's capitals (Platform-Infra-Org). GitHub expressions have no
      # lower(), so it is lowercased here and read as env.IMAGE from now on.
      - name: Resolve the image name
        run: |
          # tr, not ${VAR,,}: the latter is bash 4+ and cannot be checked
          # on a machine shipping bash 3.2, so it would only ever be
          # verified by the runner.
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${repo}/backstage" >> "$GITHUB_ENV"
      # A release App is only needed once main is protected: GITHUB_TOKEN cannot
      # be added to a branch-protection bypass list, and an App can. Until then
      # this step is skipped and the default token does the job.
      #
      # Skipped rather than failed when RELEASE_APP_ID is unset, because
      # create-github-app-token dies on an absent or malformed key with
      # "Invalid keyData / asn1 not enough data" — after the PR has already
      # merged, which is the worst moment to discover a missing secret.
      - uses: actions/create-github-app-token@v1
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # The App token when there is one, the workflow's own token otherwise.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install git-cliff
        run: |
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

      - name: Compute release version
        id: ver
        run: |
          # git-cliff drops the v prefix when there are no tags yet; keep tags uniform.
          version="$(git-cliff --config cliff.toml --bumped-version)"
          echo "version=v${version#v}" >> "$GITHUB_OUTPUT"
          # Release only if a version-bumping commit landed since the last tag.
          # Docs-only and ci-only merges refresh the changelog's [Unreleased]
          # section but don't cut a release — the image would be byte-identical.
          # `build` stays a releasing type (it can change what ships).
          latest="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          range="${latest:+${latest}..}HEAD"
          rel='^(feat|fix|perf|refactor|revert|build)(\(.+\))?!?:|^[a-z]+(\(.+\))?!:'
          if git log "$range" --format='%s' | grep -qE "$rel"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only non-releasing commits (docs/chore/…) since ${latest:-repo start}; refreshing changelog, no release."
          fi

      - name: Update CHANGELOG
        run: |
          if [ "${{ steps.ver.outputs.release }}" = "true" ]; then
            # --bump moves the "Unreleased" entries under the new vX.Y.Z heading + date.
            git-cliff --config cliff.toml --bump -o CHANGELOG.md
          else
            git-cliff --config cliff.toml -o CHANGELOG.md
          fi

      - name: Commit CHANGELOG and (on release) push the tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if [ "$RELEASE" = "true" ]; then
            # No-op safe: only commit if git-cliff actually changed the file.
            git diff --staged --quiet || git commit -m "chore(release): ${VERSION} [skip ci]"
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin HEAD:main
            git push origin "${VERSION}"
          else
            git diff --staged --quiet || git commit -m "chore(changelog): refresh unreleased [skip ci]"
            git push origin HEAD:main
          fi

      # The image is built from the backend bundle, which carries every workspace
      # package the backend depends on — the platform plugins and the compiled
      # frontend in packages/app/dist among them.
      - name: Build the bundle
        if: steps.ver.outputs.release == 'true'
        working-directory: backstage
        run: |
          yarn install --immutable
          yarn tsc
          yarn build:all

      - name: Log in to GHCR
        if: steps.ver.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: steps.ver.outputs.release == 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: backstage
          file: backstage/packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate an SBOM from the image
        if: steps.ver.outputs.release == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Attest build provenance
        if: steps.ver.outputs.release == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Extract this release's notes
        if: steps.ver.outputs.release == 'true'
        run: |
          git-cliff --config cliff.toml --latest --strip all -o RELEASE_NOTES.md
          {
            echo
            echo "### Image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${{ steps.ver.outputs.version }}"
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Create the GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            backstage/packages/backend/dist/bundle.tar.gz
            sbom.cdx.json
