name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  backstage:
    name: Backstage (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backstage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn lint:all
      - run: yarn test
        env:
          CI: "true"
      - run: yarn build:all
