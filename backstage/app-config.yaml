app:
  title: Platform
  # Logo + tab icon. Files live in packages/app/public/branding/ and are
  # referenced by path — same-origin only (the CSP is `img-src 'self' data:`).
  # Drop `mark` and the built-in temple glyph is used instead, in the sidebar
  # and the generated tab icon alike. See TechDocs → How-to → Change the logo,
  # favicon and title.
  branding:
    mark: /branding/hades.png # drawn in the accent tile; transparency shows the picked color
    # favicon: /branding/tab.png # optional: pins the tab icon instead of generating it from `mark`
    # Software-template card headers. Drop images into
    # packages/app/src/branding/<dir>/ and they are used in filename order,
    # cycling across the cards; with no images the built-in pixel art is used.
    # templateHeaders:
    #   dir: template-headers   # subfolder of packages/app/src/branding/
    #   height: 90px            # any CSS length
    #   position: center        # any CSS background-position
    # Optional fantasy naming for the sidebar. Renames screens only —
    # Requests -> Quests, Create -> Summon, Catalog -> Atlas. Request states
    # are records and are never renamed. Omit for the literal names.
    # flavour: fantasy
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Our Home page owns `/`; the catalog index moves to its default /catalog.
    - page:catalog:
        config:
          path: /catalog
    # Disable the stock Backstage themes so the platform theme is the default.
    - theme:app/light: false
    - theme:app/dark: false
    # Disable the default relations graph card (replaced by our shadcn one).
    - entity-card:catalog-graph/relations: false

organization:
  name: Platform

backend:
  # Static external-access token for local smoke tests / scripts (dev-only).
  auth:
    externalAccess:
      - type: static
        options:
          token: dev-smoke-token-please-change
          subject: local-smoke
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # Allow the generic URL reader to fetch catalog/template YAML from local Gitea.
  reading:
    allow:
      - host: localhost:3001
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  # Local dev DB = the backstage-stack Postgres (docker, port 5433). Throwaway creds.
  database:
    client: pg
    connection:
      host: localhost
      port: 5433
      user: backstage
      password: backstage
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  # Local Gitea, so the reader can fetch directory trees (needed by TechDocs to
  # pull an entity's mkdocs.yml + docs/). Dev-only basic-auth creds — production
  # empties this and uses bitbucketServer instead (app-config.production.yaml).
  gitea:
    - host: localhost:3001
      baseUrl: http://localhost:3001
      username: platform
      password: platform

proxy:
  endpoints:
    # Demo for the DynamicSelect field: the frontend calls this proxy path; the
    # proxy forwards to the upstream and injects its auth header server-side
    # (here, the static token our /options endpoint requires — a real API would
    # put its own key/token here). Secrets never reach the browser.
    '/demo-options':
      target: http://localhost:7007/api/platform-requests/options
      changeOrigin: true
      headers:
        Authorization: Bearer dev-smoke-token-please-change

    # Production: route Argo REST calls through the proxy so the token/mTLS is
    # injected here (server-side) and never lives in the plugin. Point
    # platform.argo.proxyPath at this path to switch the ArgoClient onto it.
    # '/argo-workflows':
    #   target: https://argo-server.argo.svc.cluster.local:2746
    #   changeOrigin: true
    #   headers:
    #     Authorization: Bearer ${ARGO_TOKEN}

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  environment: development
  # OIDC (openid-client) needs session support for the nonce/state exchange.
  session:
    secret: dev-only-backstage-session-secret
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}
    # Keycloak via generic OIDC. Client + realm seeded by the docker stack.
    oidc:
      development:
        metadataUrl: http://localhost:8081/realms/platform/.well-known/openid-configuration
        clientId: backstage
        clientSecret: backstage-dev-secret
        prompt: auto
        signIn:
          resolvers:
            # Map the local part of the Keycloak email (admin@… -> admin) to the
            # seeded User entity, so the user's group memberships flow into the
            # Backstage identity for RBAC.
            - resolver: emailLocalPartMatchingUserEntityName
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  # Ingest Users + Groups from the local OpenLDAP (the same directory Keycloak
  # federates to). User entity name = uid, so it matches the OIDC email
  # local-part (the sign-in resolver). Membership comes from groupOfNames member.
  providers:
    ldapOrg:
      default:
        target: ldap://localhost:1389
        bind:
          dn: cn=admin,dc=platform,dc=local
          secret: admin
        users:
          - dn: ou=people,dc=platform,dc=local
            options:
              filter: (objectClass=inetOrgPerson)
            map:
              name: uid
              displayName: cn
              email: mail
        groups:
          - dn: ou=groups,dc=platform,dc=local
            options:
              filter: (objectClass=groupOfNames)
            map:
              name: cn
              displayName: cn
              members: member
            set:
              spec.type: team
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 2 }
          initialDelay: { seconds: 5 }
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Group, User, Template]
  locations:
    # Platform catalog + templates, hosted in Gitea (config-swappable to GitHub/GitLab).
    # Root Location files resolve their relative targets against the raw URL.
    - type: url
      target: http://localhost:3001/platform/catalog/raw/branch/main/catalog-info.yaml
      rules:
        - allow: [Location, Resource, Group, User]
    - type: url
      target: http://localhost:3001/platform/software-templates/raw/branch/main/catalog-info.yaml
      rules:
        - allow: [Location, Template]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# Argo Workflows (argo-server, port-forwarded from the kind cluster).
platform:
  # Which groups are platform admins / read-only auditors. Multiple groups may
  # map to each. Admins approve anything and see all requests.
  rbac:
    adminGroups:
      - group:default/platform-admins
    auditorGroups:
      - group:default/platform-auditors
  # Home / landing page. All keys optional; omit to show both sections.
  home:
    title: Welcome to Platform
    subtitle: Your resources and open requests at a glance
    sections:
      - quickActions
      - ownedResources
      - standingRequests
      - pendingApprovals
      - recentlyVisited
    maxItems: 8
  # Request retention. Off by default: deleting rows cannot be undone.
  # Expiry moves an undecided request to EXPIRED; the windows below then delete
  # terminal requests. APPROVED and IN_PROGRESS are never deleted.
  # requests:
  #   retention:
  #     enabled: true
  #     dryRun: false           # log what would go, change nothing
  #     frequency: { hours: 6 }
  #     pendingExpiryDays: 14   # PENDING_APPROVAL -> EXPIRED (0 = never)
  #     succeededDays: 90
  #     failedDays: 90
  #     rejectedDays: 30
  #     expiredDays: 30
  argo:
    # Dev: direct to the local argo-server (plain HTTP, no auth).
    baseUrl: http://localhost:2746
    namespace: argo
    defaultTemplate: demo-resource
    # Production: set proxyPath to a proxy.endpoints entry (above) so Argo calls
    # go through the proxy, which injects the argo-server auth server-side.
    # proxyPath: /argo-workflows

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'My Company Backstage' # defaults to "backstage"
  description: 'Tools for managing your software catalog, creating new services from templates, and exploring your developer portal' # optional
