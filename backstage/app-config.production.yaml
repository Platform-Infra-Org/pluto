app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:7007

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: http://localhost:7007
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

  # Replaces the localhost:3001 (Gitea) allowance from app-config.yaml.
  reading:
    allow:
      - host: ${BITBUCKET_HOST}

auth:
  providers:
    guest: {}

# Git hosting: Bitbucket Data Center in production, Gitea in dev.
# app-config.yaml's `gitea` entry is dev-only seed infrastructure on
# localhost:3001 — the empty arrays below drop it (and the unused GitHub
# scaffold placeholder) so nothing in production can resolve to them.
integrations:
  gitea: []
  github: []
  bitbucketServer:
    - host: ${BITBUCKET_HOST}
      apiBaseUrl: https://${BITBUCKET_HOST}/rest/api/1.0
      # Personal access token with read access to the catalog + template repos.
      token: ${BITBUCKET_TOKEN}

catalog:
  # Same two root Location files as dev, served from Bitbucket instead of Gitea.
  # Their relative targets resolve against these URLs.
  locations:
    - type: url
      target: https://${BITBUCKET_HOST}/projects/${BITBUCKET_PROJECT}/repos/catalog/browse/catalog-info.yaml
      rules:
        - allow: [Location, Resource, Group, User]
    - type: url
      target: https://${BITBUCKET_HOST}/projects/${BITBUCKET_PROJECT}/repos/software-templates/browse/catalog-info.yaml
      rules:
        - allow: [Location, Template]

# NOT YET PORTED TO BITBUCKET — reads work on Bitbucket with the config above,
# but writes do not. The git-ops Argo WorkflowTemplate
# (deploy/backstage/argo/git-ops.yaml) commits resources through the *Gitea*
# contents API (`/api/v1/repos/...`) via its `gitea` + `creds` parameters, which
# default to localhost:3001. Production needs those curl calls rewritten — either
# against Bitbucket's REST API, or (simpler, host-agnostic) as a plain
# git clone/commit/push over HTTPS.
