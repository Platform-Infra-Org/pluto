<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#ffffff">
  <!-- Poseidon's trident. White on transparency, so the accent tile shows
       through and the mark recolours with the palette picker. width/height are
       required: the tab icon is drawn from this file onto a canvas.

       Each tine is one tapered spike that runs into the crossbar (rather than a
       triangle perched on a stem), and the strokes are heavy on purpose — the
       tab icon renders at 16-32px. -->
  <!-- tines: left, centre, right — each ends inside the crossbar so they merge -->
  <path d="M5.5 2.4 Q6.9 6 6.9 9.6 L5.1 9.6 Q5.1 6 5.5 2.4Z" />
  <path d="M12 0.8 Q13.05 5 12.95 9.6 L11.05 9.6 Q10.95 5 12 0.8Z" />
  <path d="M18.5 2.4 Q17.1 6 17.1 9.6 L18.9 9.6 Q18.9 6 18.5 2.4Z" />
  <!-- crossbar -->
  <rect x="4.4" y="8.2" width="15.2" height="2" rx="1" />
  <!-- shaft -->
  <rect x="11.05" y="9" width="1.9" height="10" rx="0.7" />
  <!-- butt of the shaft -->
  <rect x="8.9" y="18.4" width="6.2" height="1.9" rx="0.85" />
</svg>
