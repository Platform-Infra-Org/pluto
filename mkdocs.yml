site_name: Platform Plugin Suite
site_description: Docs for the internal developer platform (Backstage plugin suite)

# Set this once the repo exists — it is what GitHub Pages serves from, and what
# canonical links and the generated sitemap point at. MkDocs builds without it;
# the links inside the site are relative either way.
# site_url: https://<owner>.github.io/<repo>/

# Diátaxis: tutorials (learning) · how-to (tasks) · reference (facts) ·
# explanation (understanding).
nav:
  - Overview: index.md
  - Tutorials:
      - Provision your first resource: tutorials/provision-a-resource.md
  - How-to guides:
      - Author a software template: how-to/author-a-template.md
      - Configure admins & per-team approval: how-to/configure-rbac.md
      - Give a resource a data file: how-to/set-resource-data.md
      - Delete resources in bulk: how-to/delete-resources-in-bulk.md
      - Add a live (DynamicSelect) field: how-to/add-a-dynamic-select-field.md
      - Add a mid-workflow review gate: how-to/add-a-review-gate.md
      - Customise the home page: how-to/customise-the-home-page.md
      - Change the logo, favicon and title: how-to/rebrand-the-portal.md
      - Upgrade Backstage: how-to/upgrade-backstage.md
      - Deploy to Kubernetes with Helm: how-to/deploy-with-helm.md
      - Prepare for production: how-to/prepare-for-production.md
  - Reference:
      - Plugins: reference/plugins.md
      - Annotations: reference/annotations.md
      - Submit tokens (<< >>): reference/tokens.md
      - Configuration keys: reference/configuration.md
      - Request model: reference/request-model.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Request lifecycle: explanation/request-lifecycle.md
      - Secret lifecycle: explanation/secrets-lifecycle.md
      - Per-team RBAC: explanation/rbac.md
      - Workflows own Git: explanation/workflows-and-git.md
      - The pixel design system: explanation/design-system.md
      - Identity & LDAP: explanation/identity-and-ldap.md
      - What an upgrade can break: explanation/upgrade-surface.md

# docs/ is the site source, so anything dropped in it gets published. The
# pinned toolchain is build input, not a page.
exclude_docs: |
  requirements.txt

plugins:
  - techdocs-core
