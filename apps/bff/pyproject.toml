[project]
name = "bff"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "boto3>=1.34",
    "fastapi>=0.139.2",
    "gitpython>=3.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.3.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "sse-starlette>=3.4.6",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "types-jsonschema>=4.26.0.20260518",
    "types-python-jose>=3.3.0",
]

[tool.mypy]
# OpenTelemetry is an optional runtime dep (E09 Task 4): telemetry no-ops when it
# is absent. It ships no stubs, so ignore missing imports for it only — narrow, not blanket.
[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[tool.ruff]
# Autogenerated Alembic revision scripts follow a fixed template with
# boilerplate imports (op, sa) that are unused in an empty migration.
extend-exclude = ["migrations/versions"]
