apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: app-database
spec:
  arguments:
    parameters:
    - name: request
  templates:
  - name: create
    dag:
      tasks:
      - name: render-0
        templateRef:
          name: fn-jinja-render
          template: run
        arguments:
          parameters:
          - name: template
            value: <build-json.j2 for app-database>
          - name: request
            value: '{{workflow.parameters.request}}'
          - name: resolved
            value: '{}'
      - name: network
        depends: render-0
        templateRef:
          name: network
          template: create
        arguments:
          parameters:
          - name: request
            value: '{{tasks.render-0.outputs.parameters.mapping_children_network_inputs}}'
      - name: lookup-account
        depends: render-0
        templateRef:
          name: fn-api-call
          template: run
        arguments:
          parameters:
          - name: payload
            value: '{{tasks.render-0.outputs.parameters.mapping_internals_lookup_account_request}}'
      - name: extract-account
        depends: lookup-account
        templateRef:
          name: fn-json-extractor
          template: run
        arguments:
          parameters:
          - name: source
            value: '{{tasks.lookup-account.outputs.parameters.response}}'
          - name: rules
            value: '{"account_id": "$.items[0].id"}'
      - name: render-1
        depends: network && extract-account
        templateRef:
          name: fn-jinja-render
          template: run
        arguments:
          parameters:
          - name: template
            value: <build-json.j2 for app-database>
          - name: request
            value: '{{workflow.parameters.request}}'
          - name: resolved
            value: '{"mapping.children.network.outputs.subnet_id": "{{tasks.network.outputs.parameters.subnet_id}}", "mapping.internals.lookup_account.outputs.account_id": "{{tasks.extract-account.outputs.parameters.account_id}}"}'
      - name: main-call
        depends: render-1
        templateRef:
          name: fn-api-call
          template: run
        arguments:
          parameters:
          - name: payload
            value: '{{tasks.render-1.outputs.parameters.payload}}'
  - name: delete
    dag:
      tasks:
      - name: render-0
        templateRef:
          name: fn-jinja-render
          template: run
        arguments:
          parameters:
          - name: template
            value: <build-json.j2 for app-database>
          - name: request
            value: '{{workflow.parameters.request}}'
          - name: resolved
            value: '{}'
      - name: main-call
        depends: render-0
        templateRef:
          name: fn-api-call
          template: run
        arguments:
          parameters:
          - name: payload
            value: '{{tasks.render-0.outputs.parameters.payload}}'
