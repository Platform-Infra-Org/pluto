[project]
name = "cb05-runtime"
version = "0.1.0"
description = "CB05 runtime fn-* building blocks (pure Python cores for the Argo fn-* WorkflowTemplates)"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "gitpython>=3.1",
    "pyyaml>=6.0",
    "jsonpath-ng>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fn*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
