apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fn-set-value
spec:
  templates:
    - name: run
      inputs:
        parameters:
          - name: expr
          - name: args
            default: "{}"
      container:
        image: platform/cb05-runtime:latest
        command: [python, -m, fn.cli]
        args:
          - set-value
          - |
            {"expr": "{{inputs.parameters.expr}}",
             "args": {{inputs.parameters.args}}}
      outputs:
        parameters:
          - name: value
            valueFrom: { path: /tmp/outputs/value }
