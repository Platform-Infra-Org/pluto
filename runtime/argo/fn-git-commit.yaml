apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fn-git-commit
spec:
  templates:
    - name: run
      inputs:
        parameters:
          - name: repo
          - name: path
          - name: content
      container:
        image: platform/cb05-runtime:latest
        command: [python, -m, fn.cli]
        args:
          - git-commit
          - |
            {"repo": "{{inputs.parameters.repo}}",
             "path": "{{inputs.parameters.path}}",
             "content": {{inputs.parameters.content}},
             "identity": {"name": "platform-bot", "email": "bot@platform.local"}}
      outputs:
        parameters:
          - name: sha
            valueFrom: { path: /tmp/outputs/sha }
