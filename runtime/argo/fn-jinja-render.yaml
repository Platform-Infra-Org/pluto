apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fn-jinja-render
spec:
  templates:
    - name: run
      inputs:
        parameters:
          - name: template
          - name: request
          - name: resolved
            default: "{}"
      container:
        image: platform/cb05-runtime:latest
        command: [python, -m, fn.cli]
        args:
          - jinja-render
          - |
            {"template": {{inputs.parameters.template}},
             "request": {{inputs.parameters.request}},
             "resolved": {{inputs.parameters.resolved}}}
      outputs:
        parameters:
          - name: payload
            valueFrom: { path: /tmp/outputs/payload }
          - name: mapping
            valueFrom: { path: /tmp/outputs/mapping }
