apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fn-json-extractor
spec:
  templates:
    - name: run
      inputs:
        parameters:
          - name: source
          - name: rules
      container:
        image: platform/cb05-runtime:latest
        command: [python, -m, fn.cli]
        args:
          - json-extractor
          - |
            {"source": {{inputs.parameters.source}},
             "rules": {{inputs.parameters.rules}}}
      outputs:
        parameters:
          - name: extracted
            valueFrom: { path: /tmp/outputs/extracted }
